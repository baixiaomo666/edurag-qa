# ===== 复制本文件为 config.ini 后填写 =====
# cp config.example.ini config.ini

[mysql]
host = localhost
user = root
password = YOUR_MYSQL_PASSWORD
database = subjects_kg
qa_table = jpkb

[redis]
host = localhost
port = 6379
password = YOUR_REDIS_PASSWORD
db = 0

[logger]
log_file = logs/app.log

[milvus]
uri = http://localhost:19530
database_name = itcast
collection_name = edurag

[llm]
model = deepseek-chat
llm_api_key = YOUR_DEEPSEEK_API_KEY
llm_base_url = https://api.deepseek.com

[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 3
candidate_m = 2
# FAQ 关键词层置信阈值（全库 softmax 的分母随题库规模变化，必须随题库重新标定）
# 标定方式：在 100 条题库上取负样本最大置信度 0.673，向上取 0.68 保证负样本零误命中
faq_threshold = 0.68
faq_snapshot_ttl = 3600
answer_cache_ttl = 3600

[app]
valid_sources = ["kaoyan", "cs", "employment"]
customer_service_phone = YOUR_PHONE
